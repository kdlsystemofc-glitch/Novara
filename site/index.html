<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novara Pizzas e Esfihas — Forneria Artesanal</title>
  
  <!-- Google Fonts: Playfair Display, Plus Jakarta Sans, Caveat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Playfair+Display:ital,wght@0,600..900;1,600..900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <main class="editorial-canvas">
      
      <!-- Fio de Queijo Contínuo da Assinatura (Spine Central) -->
      <div class="cheese-pull-spine" aria-hidden="true">
        <picture>
          <source srcset="assets/cheese-ribbon-1600.webp" media="(min-width: 600px)">
          <img src="assets/cheese-ribbon-800.webp" alt="Fio de queijo mozzarella puxado da pizza" width="267" height="800">
        </picture>
      </div>

      <!-- ====================================================================
           SEÇÃO 1: HERO & CRUST ALCHEMY
           ==================================================================== -->
      <section id="hero-crust-alchemy" class="editorial-section sec-hero">
        
        <!-- Faixa de Topo / Header Metadados -->
        <header class="hero-top-bar">
          <div class="badge-social-proof">
            <span class="proof-star">★ 4.5</span>
            <span class="proof-title">GOOGLE RATING</span>
            <span class="proof-count">895 AVALIAÇÕES</span>
          </div>

          <div class="hero-header-center">
            <span class="tag-category">Pizzaria & Forneria Artesanal</span>
            <span class="hand-note note-editorial">editorial paper</span>
          </div>

          <!-- Selo de Cera Superior Direito -->
          <div class="hero-wax-container">
            <img src="assets/wax-seal-800.webp" alt="Selo de cera de qualidade Novara" class="wax-seal-badge hero-seal" width="60" height="60">
            <div class="stamp-fermentation">FERMENTAZIONE 48H</div>
          </div>
        </header>

        <!-- Título Monumental NOVARA -->
        <div class="brand-hero-title-wrap">
          <h1 class="brand-hero-title">NOVARA</h1>
        </div>

        <!-- Stickers Flutuantes Decorativos de Topo -->
        <div class="hero-stickers-layer" aria-hidden="true">
          <!-- Folha de Manjericão -->
          <div class="sticker-basil-wrap">
            <svg viewBox="0 0 32 32" width="28" height="28">
              <path d="M6,26 C12,18 20,6 26,6 C26,12 22,24 6,26 Z" fill="#2E7D32" stroke="#FFFFFF" stroke-width="1.5"/>
            </svg>
          </div>

          <!-- Sticker Smile Amarelo Direito -->
          <div class="sticker-smile sticker-smile-hero">
            <svg viewBox="0 0 24 24">
              <circle cx="8" cy="9" r="1.5"/>
              <circle cx="16" cy="9" r="1.5"/>
              <path d="M6.5,14 Q12,19.5 17.5,14" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

        <!-- Grid de Conteúdo Inferior da Seção 1 (Crust Alchemy + Dough) -->
        <div class="editorial-grid hero-content-grid">
          
          <!-- Coluna Esquerda: Crust Alchemy com Sticker de Tomate -->
          <div class="hero-left-col">
            <div class="tomato-badge-flow">
              <svg class="sticker-tomato-svg" viewBox="0 0 40 40" width="36" height="36">
                <circle cx="20" cy="22" r="16" fill="#D32F2F" stroke="#FFFFFF" stroke-width="2.5"/>
                <path d="M20,6 Q18,12 12,14 M20,6 Q22,12 28,14 M20,6 L20,13" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" fill="none"/>
              </svg>
              <span class="hand-note note-tomato">EXTRA VIRGEM // MOLHO CASEIRO</span>
            </div>

            <h2 class="title-crust-alchemy">
              <span class="sub-crust">CRUST</span>
              <span class="main-crust">CRUST ALCHEMY</span>
            </h2>
          </div>

          <!-- Coluna Direita: Massa Crua & Post-it 48h -->
          <div class="hero-right-col">
            <div class="dough-card">
              <picture>
                <source srcset="assets/dough-fermentation-1600.webp" media="(min-width: 600px)">
                <img src="assets/dough-fermentation-800.webp" alt="Massa de pizza artesanal fermentando sobre pedra com farinha" class="img-dough" width="800" height="533">
              </picture>
              
              <!-- Post-it Azul Pastel Inclinado -->
              <div class="postit-tag postit-dough">
                <span class="postit-hours">48 horas</span>
                <span class="postit-desc">fermentação lenta da massa // farinha especial</span>
              </div>
            </div>

            <!-- Anotação Manuscrita com Seta -->
            <div class="hand-note-dough">
              <span class="hand-note">fermentação paciente ➔</span>
            </div>
          </div>

        </div>

      </section>

    </main>
  </div>
</body>
</html>
